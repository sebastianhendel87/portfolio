<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Work — Sebastian Hendel</title>
  <style>
    @font-face {
      font-family: 'Monument Grotesk';
      src: url('fonts/MonumentGrotesk.woff2') format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Monument Grotesk';
      src: url('fonts/MonumentGrotesk-Italic.woff2') format('woff2');
      font-weight: 100 900;
      font-style: italic;
      font-display: swap;
    }

    :root {
      --bg: #0a0a0a;
      --text: #f5f5f5;
      --text-strong: #fff;
      --muted: #888;
      --muted-hover: #b0b0b0;
      --border: #222;
    }
    body.light {
      --bg: #e8e6e4;
      --text: #1a1a1a;
      --text-strong: #0a0a0a;
      --muted: #555;
      --muted-hover: #333;
      --border: #d2d0cd;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Monument Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.2;
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }
    a:hover { opacity: 0.85; }

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 32px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
    }
    .navbar .name {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text-strong);
    }
    .nav-links {
      display: flex;
      gap: 36px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .nav-links a {
      color: var(--text);
      position: relative;
      transition: color 0.2s ease;
    }
    .nav-links a::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -4px;
      height: 2px;
      background: currentColor;
      width: 0;
      transition: width 0.3s ease;
    }
    .nav-links a:hover { color: var(--muted-hover); }
    .nav-links a:hover::after { width: 100%; }
    .nav-links a.active { color: var(--muted); }

    .work-list {
      padding: 120px 220px 80px 80px;
      max-width: 1400px;
      margin: 0 0 0 auto;
      text-align: right;
    }

    .work-item {
      display: block;
      padding: 20px 0;
      transition: color 0.2s ease, opacity 0.2s ease;
    }
    .work-item:hover {
      color: var(--muted-hover);
    }

    .work-item__title {
      font-size: clamp(56px, 14vw, 160px);
      font-weight: 600;
      letter-spacing: -0.04em;
      line-height: 0.9;
      margin: 0;
    }

    /* Hover: proyecto + año abajo a la izquierda (como contacto en home) */
    .work-hover-info {
      position: fixed;
      bottom: 32px;
      left: 32px;
      z-index: 50;
      font-size: 14px;
      line-height: 1.45;
      color: var(--muted);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .work-hover-info.is-visible {
      opacity: 1;
    }
    .work-hover-info__project { font-weight: 600; color: var(--text-strong); }
    .work-hover-info__year { color: var(--muted); }
  </style>
</head>
<body class="light">

  <nav class="navbar">
    <a href="index.html" class="name">Sebastian Hendel</a>
    <div class="nav-links">
      <a href="index.html#about">About</a>
      <a href="work.html" class="active">Works</a>
    </div>
  </nav>

  <div class="work-hover-info" id="work-hover-info" aria-hidden="true">
    <span class="work-hover-info__project" id="work-hover-project"></span><span class="work-hover-info__year" id="work-hover-year"></span>
  </div>

  <main class="work-list">
    <a href="spotify.html" class="work-item" data-project="Secondary Layer Tool" data-year="2021">
      <h2 class="work-item__title">Spotify</h2>
    </a>
    <a href="carbo-culture.html" class="work-item" data-project="Visual Identity + Website design" data-year="2023">
      <h2 class="work-item__title">Carbo Culture</h2>
    </a>
    <a href="tonscan.html" class="work-item" data-project="Blockchain Explorer" data-year="2024">
      <h2 class="work-item__title">Tonscan</h2>
    </a>
    <a href="dune.html" class="work-item" data-project="Visual Identity + Website design" data-year="2025">
      <h2 class="work-item__title">Dune</h2>
    </a>
  </main>

  <script>
    (function () {
      var hoverInfo = document.getElementById('work-hover-info');
      var hoverProject = document.getElementById('work-hover-project');
      var hoverYear = document.getElementById('work-hover-year');
      var items = document.querySelectorAll('.work-item');
      if (!hoverInfo || !hoverProject || !hoverYear) return;
      items.forEach(function (el) {
        el.addEventListener('mouseenter', function () {
          hoverProject.textContent = el.getAttribute('data-project') + ', ';
          hoverYear.textContent = el.getAttribute('data-year');
          hoverInfo.classList.add('is-visible');
          hoverInfo.setAttribute('aria-hidden', 'false');
        });
        el.addEventListener('mouseleave', function () {
          hoverInfo.classList.remove('is-visible');
          hoverInfo.setAttribute('aria-hidden', 'true');
        });
      });
    })();
  </script>
</body>
</html>

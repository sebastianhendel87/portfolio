<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Work — Sebastian Hendel</title>
  <style>
    @font-face {
      font-family: 'Monument Grotesk';
      src: url('fonts/MonumentGrotesk.woff2') format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Monument Grotesk';
      src: url('fonts/MonumentGrotesk-Italic.woff2') format('woff2');
      font-weight: 100 900;
      font-style: italic;
      font-display: swap;
    }

    :root {
      --bg: #0a0a0a;
      --text: #f5f5f5;
      --text-strong: #fff;
      --muted: #888;
      --muted-hover: #b0b0b0;
      --border: #222;
    }
    body.light {
      --bg: #e8e6e4;
      --text: #1a1a1a;
      --text-strong: #0a0a0a;
      --muted: #555;
      --muted-hover: #333;
      --border: #d2d0cd;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Monument Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.2;
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }
    a:hover { opacity: 0.85; }

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 32px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
    }
    .navbar .name {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text-strong);
    }
    .nav-links {
      display: flex;
      gap: 36px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .nav-links a {
      color: var(--text);
      position: relative;
      transition: color 0.2s ease;
    }
    .nav-links a::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -4px;
      height: 2px;
      background: currentColor;
      width: 0;
      transition: width 0.3s ease;
    }
    .nav-links a:hover { color: var(--muted-hover); }
    .nav-links a:hover::after { width: 100%; }
    .nav-links a.active { color: var(--muted); }

    .work-list {
      padding: 120px 40px 80px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .work-item {
      display: block;
      padding: 48px 0;
      border-bottom: 1px solid var(--border);
      transition: color 0.2s ease, opacity 0.2s ease;
    }
    .work-item:hover {
      color: var(--muted-hover);
    }
    .work-item:last-child {
      border-bottom: none;
    }

    .work-item__title {
      font-size: clamp(48px, 10vw, 120px);
      font-weight: 600;
      letter-spacing: -0.04em;
      line-height: 0.95;
      margin: 0;
    }
    .work-item__meta {
      font-size: clamp(14px, 1.5vw, 18px);
      color: var(--muted);
      margin-top: 12px;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body class="light">

  <nav class="navbar">
    <a href="index.html" class="name">Sebastian Hendel</a>
    <div class="nav-links">
      <a href="index.html#about">About</a>
      <a href="work.html" class="active">Works</a>
    </div>
  </nav>

  <main class="work-list">
    <a href="#" class="work-item">
      <h2 class="work-item__title">Brand identity & strategy</h2>
      <p class="work-item__meta">Client name · Year</p>
    </a>
    <a href="#" class="work-item">
      <h2 class="work-item__title">Digital campaign</h2>
      <p class="work-item__meta">Client name · Year</p>
    </a>
    <a href="#" class="work-item">
      <h2 class="work-item__title">Website & experience</h2>
      <p class="work-item__meta">Client name · Year</p>
    </a>
    <a href="#" class="work-item">
      <h2 class="work-item__title">Content & production</h2>
      <p class="work-item__meta">Client name · Year</p>
    </a>
    <a href="#" class="work-item">
      <h2 class="work-item__title">Naming & verbal identity</h2>
      <p class="work-item__meta">Client name · Year</p>
    </a>
    <a href="#" class="work-item">
      <h2 class="work-item__title">Motion & film</h2>
      <p class="work-item__meta">Client name · Year</p>
    </a>
  </main>

</body>
</html>
